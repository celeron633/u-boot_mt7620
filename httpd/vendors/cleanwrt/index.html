<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>固件升级</title>
<link rel="stylesheet" href="/style.css">
<script src="/main.js" defer>
</script>
</head>
<body>
<div class="app-shell">
<aside class="app-sidebar">
<div class="app-brand" data-i18n="brand">系统恢复模式</div>
<nav class="app-nav" aria-label="主导航">
<a href="/index.html" class="active" aria-current="page" data-i18n="firmware">固件升级</a>
<a href="/backup.html" data-i18n="backup">备份</a>
<a href="/reboot.html" data-i18n="reboot">重启</a>
<a href="/environment.html" data-i18n="environment">环境设置</a>
</nav>
<div class="app-controls">
<div class="app-control-row">
<label class="app-control-label" for="language" data-i18n="language">语言</label>
<select class="app-select" id="language">
<option value="auto" data-i18n="auto">自动</option>
<option value="zh">中文</option>
<option value="en">English</option>
</select>
</div>
<div class="app-control-row">
<label class="app-control-label" for="theme" data-i18n="theme">主题</label>
<select class="app-select" id="theme">
<option value="auto" data-i18n="auto">自动</option>
<option value="light" data-i18n="light">浅色</option>
<option value="dark" data-i18n="dark">深色</option>
</select>
</div>
</div>
</aside>
<main class="app-content">
<div id="m">
<h1 data-i18n="firmware">固件升级</h1>
<p data-i18n="firmware_hint">请选择适配当前设备的固件。上传完成后将立即写入 Flash，并自动重启。</p>
<form id="firmware-form" method="post" action="/" enctype="multipart/form-data">
<div class="sysinfo" id="sysinfo" aria-live="polite" data-i18n="loading">正在获取设备信息…</div>
<input id="file" type="file" name="firmware" aria-label="固件文件" required>
<div id="file-meta" class="file-meta" aria-live="polite">
</div>
<button type="submit" data-i18n="upload">上传并更新</button>
<p class="status" id="upload-status" role="status">
</p>
</form>
<div class="i w">
<strong data-i18n="warnings">注意事项</strong>
<ul>
<li data-i18n="no_power">升级过程中请勿断电或断开网络。</li>
<li data-i18n="auto_restart">写入成功后设备会自动重启，请耐心等待。</li>
<li data-i18n="choose_correct">请确认设备型号与分区布局；建议更新前先备份整片 Flash。</li>
</ul>
</div>
</div>
<footer id="version">U-Boot 1.1.3 · MT7620</footer>
</main>
</div>
</body>
</html>
