<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备份</title>
<link rel="stylesheet" href="/style.css">
<script src="/main.js" defer>
</script>
</head>
<body>
<div class="app-shell">
<aside class="app-sidebar">
<div class="app-brand" data-i18n="brand">系统恢复模式</div>
<nav class="app-nav" aria-label="主导航">
<a href="/index.html" data-i18n="firmware">固件升级</a>
<a href="/backup.html" class="active" aria-current="page" data-i18n="backup">备份</a>
<a href="/reboot.html" data-i18n="reboot">重启</a>
<a href="/environment.html" data-i18n="environment">环境设置</a>
</nav>
<div class="app-controls">
<div class="app-control-row">
<label class="app-control-label" for="language" data-i18n="language">语言</label>
<select class="app-select" id="language">
<option value="auto" data-i18n="auto">自动</option>
<option value="zh">中文</option>
<option value="en">English</option>
</select>
</div>
<div class="app-control-row">
<label class="app-control-label" for="theme" data-i18n="theme">主题</label>
<select class="app-select" id="theme">
<option value="auto" data-i18n="auto">自动</option>
<option value="light" data-i18n="light">浅色</option>
<option value="dark" data-i18n="dark">深色</option>
</select>
</div>
</div>
</aside>
<main class="app-content">
<div id="m">
<h1 data-i18n="backup">备份</h1>
<p data-i18n="backup_hint">下载整片 Flash 的原始二进制镜像，用于编程器恢复。</p>
<div class="actions">
<div class="sysinfo" id="sysinfo" aria-live="polite" data-i18n="loading">正在获取设备信息…</div>
<dl class="backup-target">
<dt data-i18n="target">备份目标</dt>
<dd data-i18n="full_flash">整片 SPI NOR Flash</dd>
<dt data-i18n="capacity">文件大小</dt>
<dd id="backup-size" data-i18n="detected">按设备实际探测容量</dd>
<dt data-i18n="filename">文件名</dt>
<dd>flash-backup.bin</dd>
</dl>
<a class="button" id="download" href="/backup.bin" download="flash-backup.bin" data-i18n="download">下载完整备份</a>
<p class="status" id="backup-status" role="status">
</p>
</div>
<div class="i w">
<strong data-i18n="warnings">注意事项</strong>
<ul>
<li data-i18n="backup_contains">包含 U-Boot、环境变量、出厂校准、系统固件和保留分区。</li>
<li data-i18n="backup_wait">备份期间请保持供电和网络连接，完整下载可能需要几分钟。</li>
<li data-i18n="backup_check">请确认下载文件大小等于 Flash 容量，再用于编程器恢复。</li>
</ul>
</div>
</div>
<footer id="version">U-Boot 1.1.3 · MT7620</footer>
</main>
</div>
</body>
</html>
