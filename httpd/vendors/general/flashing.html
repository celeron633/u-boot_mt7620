<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>更新进行中</title>
<style>*{box-sizing:border-box}:root{color-scheme:light dark;--bg:#f6f7fb;--card:#fff;--text:#111827;--border:#e5e7eb;--primary:#2563eb}@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0b1220;--card:#0f172a;--text:#e5e7eb;--border:#334155;--primary:#60a5fa}}:root[data-theme=dark]{--bg:#0b1220;--card:#0f172a;--text:#e5e7eb;--border:#334155;--primary:#60a5fa}body{margin:0;padding:48px 16px;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}main{max-width:600px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px #0001;text-align:center;overflow:hidden}h1{font-size:28px;margin:0;padding:24px;border-bottom:1px solid var(--border)}p{padding:20px;margin:0}.spinner{width:32px;height:32px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:8px auto 28px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}a{color:var(--primary)}footer{text-align:center;margin-top:20px;color:#6b7280}</style>
</head>
<body>
<main>
<h1>更新进行中</h1>
<p id="message">文件已上传，正在写入 Flash，请等待设备自动重启。此过程可能需要几分钟，请勿断电。</p>
<div class="spinner" role="status" aria-label="请稍候">
</div>
</main>
<footer>U-Boot 1.1.3 · MT7620</footer>
<script>(function(){try{var theme=localStorage.getItem('mt7620-theme');if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme);var lang=localStorage.getItem('mt7620-language')||'auto';if(lang==='en'||(lang==='auto'&&!/^zh/i.test(navigator.language))){document.documentElement.lang='en';document.title='Update in progress';document.querySelector('h1').textContent='Update in progress';document.getElementById('message').textContent='The file has been uploaded. Flash is being written; wait for the automatic restart. This may take a few minutes. Keep the power on.';}}catch(e){}})();</script>
</body>
</html>
