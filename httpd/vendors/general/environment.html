<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环境设置</title>
<link rel="stylesheet" href="/style.css">
<script src="/main.js" defer>
</script>
</head>
<body>
<div class="app-shell">
<aside class="app-sidebar">
<div class="app-brand" data-i18n="brand">系统恢复模式</div>
<nav class="app-nav" aria-label="主导航">
<a href="/index.html" data-i18n="firmware">固件升级</a>
<a href="/backup.html" data-i18n="backup">备份</a>
<a href="/reboot.html" data-i18n="reboot">重启</a>
<a href="/environment.html" class="active" aria-current="page" data-i18n="environment">环境设置</a>
</nav>
<div class="app-controls">
<div class="app-control-row">
<label class="app-control-label" for="language" data-i18n="language">语言</label>
<select class="app-select" id="language">
<option value="auto" data-i18n="auto">自动</option>
<option value="zh">中文</option>
<option value="en">English</option>
</select>
</div>
<div class="app-control-row">
<label class="app-control-label" for="theme" data-i18n="theme">主题</label>
<select class="app-select" id="theme">
<option value="auto" data-i18n="auto">自动</option>
<option value="light" data-i18n="light">浅色</option>
<option value="dark" data-i18n="dark">深色</option>
</select>
</div>
</div>
</aside>
<main class="app-content">
<div id="m">
<h1 data-i18n="environment">环境设置</h1>
<p data-i18n="env_hint">将保存的 U-Boot 环境变量恢复为当前镜像的编译默认值。</p>
<div class="actions">
<form method="post" action="/env_reset" data-confirm="confirm_env">
<button type="submit" data-i18n="env_reset">恢复默认环境</button>
</form>
</div>
<div class="i w">
<strong data-i18n="warnings">注意事项</strong>
<ul>
<li data-i18n="env_warning">此操作会移除自定义启动与网络设置，保存成功后需重启生效。</li>
</ul>
</div>
</div>
<footer id="version">U-Boot 1.1.3 · MT7620</footer>
</main>
</div>
</body>
</html>
